<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>无边记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 主画布 -->
  <canvas id="main-canvas"></canvas>

  <!-- 顶部工具栏 -->
  <div id="toolbar">
    <!-- 第一行：工具 -->
    <div class="toolbar-row">
      <div class="tool-group" id="tool-buttons">
        <button class="tool-btn active" data-tool="select" title="选择 (V)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 8-6.5 1.5L9 19z"/></svg>
        </button>
        <button class="tool-btn" data-tool="hand" title="抓手 (H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v1M14 7V4a2 2 0 0 0-4 0v3M10 7V5a2 2 0 0 0-4 0v6"/><path d="M18 11a2 2 0 0 1 4 0v3a8 8 0 0 1-8 8h-2c-2.5 0-4.5-1-6.2-2.8L3 16.5a2 2 0 0 1 2.8-2.8L6 14V5"/></svg>
        </button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-tool="pen" title="画笔 (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="tool-btn" data-tool="rectangle" title="矩形 (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="ellipse" title="椭圆 (O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="直线 (L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19L19 5"/></svg>
        </button>
        <button class="tool-btn" data-tool="arrow" title="箭头 (A)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19L19 5M12 5h7v7"/></svg>
        </button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-tool="text" title="文本 (T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12M12 4v16M8 20h8"/></svg>
        </button>
        <button class="tool-btn" data-tool="sticky-note" title="便签 (N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h13"/><path d="M5.5 13.5L13 6l5 5-7.5 7.5a2.12 2.12 0 0 1-3 0L5.5 16.5a2.12 2.12 0 0 1 0-3Z"/></svg>
        </button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-tool="image" title="插入图片 (I)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.5-3.5a2 2 0 0 0-3 0L5 21"/></svg>
        </button>
        <button class="tool-btn" data-tool="table" title="插入表格 (B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        </button>
        <input type="file" id="input-image-file" accept="image/*" style="display:none">
      </div>

      <span class="tool-sep"></span>

      <!-- 撤销/重做 + 操作 -->
      <div class="tool-group">
        <button id="btn-undo" class="tool-btn" title="撤销 (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9H3"/></svg>
        </button>
        <button id="btn-redo" class="tool-btn" title="重做 (Ctrl+Shift+Z)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9h9"/></svg>
        </button>
        <span class="tool-sep"></span>
        <input type="file" id="input-load-file" accept=".json" style="display:none">
        <button id="btn-export" class="tool-btn" title="导出 PNG (Ctrl+E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <button id="btn-theme" class="tool-btn" title="切换明暗主题">
          <svg id="icon-theme-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg id="icon-theme-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="btn-clear" class="tool-btn danger" title="清空画布">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </div>

    <!-- 第二行：样式控制 -->
    <div class="toolbar-row toolbar-row-secondary">
      <div class="tool-group" id="style-controls">
        <div class="color-block">
          <button id="btn-fill-color" class="style-btn" title="填充颜色">
            <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="4" id="fill-color-swatch" stroke="rgba(128,128,128,0.5)" stroke-width="1.5"/></svg>
          </button>
        </div>
        <div class="color-block">
          <button id="btn-stroke-color" class="style-btn" title="线条/文字颜色">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="7" id="stroke-color-swatch" fill="none" stroke-width="4"/><circle cx="12" cy="12" r="2.5" fill="rgba(128,128,128,0.3)"/></svg>
          </button>
        </div>
      </div>

      <span class="tool-sep"></span>

      <label class="slider-label" title="线条粗细">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 20L20 4" stroke-width="1"/><path d="M4 14L14 4" stroke-width="3"/></svg>
        <input type="range" id="input-stroke-width" min="1" max="20" value="2" class="style-slider">
        <span id="stroke-width-val">2</span>
      </label>
      <label class="slider-label" title="字体大小">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5h10M10 5v14M7 19h6"/></svg>
        <input type="range" id="input-font-size" min="10" max="80" value="20" class="style-slider">
        <span id="font-size-val">20</span>
      </label>

      <span class="tool-sep"></span>

      <div class="tool-group" id="text-align-btns">
        <button class="tool-btn text-align-btn active" data-align="left" title="左对齐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h10M4 14h13M4 18h16"/></svg>
        </button>
        <button class="tool-btn text-align-btn" data-align="center" title="居中">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 10h10M5.5 14h13M4 18h16"/></svg>
        </button>
        <button class="tool-btn text-align-btn" data-align="right" title="右对齐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M10 10h10M7 14h13M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 颜色弹窗（填充） -->
  <div id="fill-color-popup" class="color-popup">
    <div class="color-popup-arrow"></div>
    <div class="color-popup-body">
      <div class="color-popup-header">
        <span class="color-popup-label">填充</span>
        <div class="color-popup-preview" id="fill-color-preview"></div>
      </div>
      <div class="color-popup-presets" id="fill-preset-colors"></div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">H</span>
        <input type="range" id="fill-hue" class="popup-hue-slider" min="0" max="360" value="0">
      </div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">S</span>
        <input type="range" id="fill-sat" class="popup-sat-slider" min="0" max="100" value="0">
      </div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">B</span>
        <input type="range" id="fill-light" class="popup-light-slider" min="0" max="100" value="100">
      </div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">A</span>
        <input type="range" id="input-fill-alpha" class="popup-alpha-slider" min="0" max="100" value="100">
      </div>
    </div>
  </div>

  <!-- 颜色弹窗（描边/文字） -->
  <div id="stroke-color-popup" class="color-popup">
    <div class="color-popup-arrow"></div>
    <div class="color-popup-body">
      <div class="color-popup-header">
        <span class="color-popup-label">描边/文字</span>
        <div class="color-popup-preview" id="stroke-color-preview"></div>
      </div>
      <div class="color-popup-presets" id="stroke-preset-colors"></div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">H</span>
        <input type="range" id="stroke-hue" class="popup-hue-slider" min="0" max="360" value="0">
      </div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">S</span>
        <input type="range" id="stroke-sat" class="popup-sat-slider" min="0" max="100" value="0">
      </div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">B</span>
        <input type="range" id="stroke-light" class="popup-light-slider" min="0" max="100" value="0">
      </div>
      <div class="color-popup-slider-row">
        <span class="slider-icon">A</span>
        <input type="range" id="input-stroke-alpha" class="popup-alpha-slider" min="0" max="100" value="100">
      </div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div id="statusbar">
    <span id="status-tool">选择</span>
    <span id="status-sep">·</span>
    <span id="status-zoom">100%</span>
    <span id="status-sep2">·</span>
    <span id="status-count">0 个元素</span>
  </div>

  <!-- 场景导航 -->
  <div id="scene-bar">
    <button id="btn-present-mode" title="演讲模式 (Ctrl+Shift+P)">
      <svg viewBox="0 0 24 24" width="14" height="14"><polygon points="6,3 20,12 6,21" fill="currentColor"/></svg>
    </button>
    <button id="btn-scene-prev" title="上一个场景 (Ctrl+[)">◀</button>
    <span id="scene-label" title="点击打开场景管理器">无场景</span>
    <button id="btn-scene-next" title="下一个场景 (Ctrl+])">▶</button>
    <button id="btn-scene-add" title="保存当前视图为场景 (Ctrl+Shift+S)">+</button>
  </div>

  <!-- 场景管理面板 -->
  <div id="scene-panel" style="display:none">
    <div id="scene-panel-header">
      <span class="scene-panel-title">场景管理</span>
      <div class="scene-panel-actions">
        <button id="scene-panel-select-all" title="全选">☑</button>
        <button id="scene-panel-delete" title="删除选中" class="scene-panel-danger">🗑</button>
        <button id="scene-panel-close" title="关闭">✕</button>
      </div>
    </div>
    <!-- 跳转到场景 -->
    <div id="scene-panel-jump">
      <span class="jump-label">跳转到</span>
      <input type="number" id="scene-jump-input" min="1" placeholder="页码">
      <button id="scene-jump-btn" title="跳转">→</button>
    </div>
    <div id="scene-panel-list"></div>
    <div id="scene-panel-footer">
      <button id="scene-panel-add" title="添加当前视图为场景">+ 添加场景</button>
      <div class="scene-panel-file-wrapper">
        <button id="scene-panel-file-btn" class="scene-panel-file-btn" title="文件操作">📁 文件操作 ▾</button>
        <div id="scene-panel-file-dropdown" class="file-dropdown" style="display:none">
          <div class="scene-panel-file-item" data-action="save">💾 保存到文件</div>
          <div class="scene-panel-file-item" data-action="load">📂 从文件加载</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 尺寸面板 -->
  <div id="size-panel" style="display:none">
    <div class="size-row">
      <span class="size-label">W</span>
      <input type="number" id="input-width" class="size-input" min="1" step="1">
    </div>
    <button id="btn-lock-ratio" class="size-lock-btn" title="锁定比例">🔗</button>
    <div class="size-row">
      <span class="size-label">H</span>
      <input type="number" id="input-height" class="size-input" min="1" step="1">
    </div>
  </div>

  <!-- 文本编辑浮层 -->
  <textarea id="text-editor" style="display:none;" placeholder="输入文本..." rows="1"></textarea>

  <!-- 右键菜单 -->
  <div id="context-menu" style="display:none">
    <div class="ctx-item" data-action="copy">复制 (Ctrl+C)</div>
    <div class="ctx-item" data-action="paste">粘贴 (Ctrl+V)</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="bring-front">放到最上层</div>
    <div class="ctx-item" data-action="send-back">放到最底层</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="group">编组 (Ctrl+G)</div>
    <div class="ctx-item" data-action="ungroup">取消编组 (Ctrl+Shift+G)</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="lock">🔒 锁定</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" data-action="table-add-row">表格: 插入行</div>
    <div class="ctx-item" data-action="table-del-row">表格: 删除行</div>
    <div class="ctx-item" data-action="table-add-col">表格: 插入列</div>
    <div class="ctx-item" data-action="table-del-col">表格: 删除列</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item ctx-danger" data-action="delete">删除</div>
  </div>

  <!-- 加载 JS 模块 -->
  <script src="js/camera.js"></script>
  <script src="js/elements.js"></script>
  <script src="js/history.js"></script>
  <script src="js/canvas-renderer.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
